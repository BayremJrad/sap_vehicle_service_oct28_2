$kind: http-request
url: "{{baseUrl}}/vehicles/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
settings: {}
examples: ./.resources/Retrieve a vehicle.resources/examples
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Contract Tests: Retrieve a Vehicle
      const statusCode = pm.response.code;

      // ── General ──────────────────────────────────────────────────────────
      pm.test("Status code is one of: 200, 404, 500", function () {
          pm.expect(statusCode).to.be.oneOf([200, 404, 500]);
      });

      pm.test("Content-Type is application/json", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response body is valid JSON", function () {
          pm.response.json();
      });

      const body = pm.response.json();

      // ── 200 – Vehicle object ──────────────────────────────────────────────
      if (statusCode === 200) {

          pm.test("200 - Vehicle object has all required fields", function () {
              pm.expect(body).to.have.all.keys("id", "nickName", "vin", "make", "model", "year", "miles");
          });

          pm.test("200 - Field types match the contract", function () {
              pm.expect(body.id,       "id")       .to.be.a("number");
              pm.expect(body.nickName, "nickName") .to.be.a("string");
              pm.expect(body.vin,      "vin")      .to.be.a("string");
              pm.expect(body.make,     "make")     .to.be.a("string");
              pm.expect(body.model,    "model")    .to.be.a("string");
              pm.expect(body.year,     "year")     .to.be.a("string");
              pm.expect(body.miles,    "miles")    .to.be.a("number");
          });

          pm.test("200 - No unexpected fields in response", function () {
              const allowed = ["id", "nickName", "vin", "make", "model", "year", "miles"];
              Object.keys(body).forEach(key => pm.expect(allowed, key).to.include(key));
          });

          pm.test("200 - id is a positive integer", function () {
              pm.expect(body.id).to.be.above(0);
              pm.expect(Number.isInteger(body.id)).to.be.true;
          });

          pm.test("200 - miles is a non-negative integer", function () {
              pm.expect(body.miles).to.be.at.least(0);
              pm.expect(Number.isInteger(body.miles)).to.be.true;
          });

          pm.test("200 - vin is a non-empty string", function () {
              pm.expect(body.vin).to.not.be.empty;
          });

      // ── 404 / 500 – Error object ──────────────────────────────────────────
      } else if (statusCode === 404 || statusCode === 500) {

          pm.test(statusCode + " - Error response has 'message' field", function () {
              pm.expect(body).to.have.property("message");
          });

          pm.test(statusCode + " - 'message' is a non-empty string", function () {
              pm.expect(body.message).to.be.a("string").and.to.not.be.empty;
          });

      }
